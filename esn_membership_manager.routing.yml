esn_membership_manager.scan:
  path: '/api/memberships/scan'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ScanController::scanCard'
    _title: 'Scan Free Passes and ESNcards'
  requirements:
    _permission: 'scan cards'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

esn_membership_manager.add:
  path: '/api/memberships/add'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AddController::addCard'
    _title: 'Add ESNcard'
  requirements:
    _permission: 'manage esncard numbers'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

esn_membership_manager.status:
  path: '/api/memberships/status'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\StatusController::changeStatus'
    _title: 'Change the status of an ESNcard'
  requirements:
    _access: 'TRUE'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

esn_membership_manager.edit:
  path: '/api/memberships/edit'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\EditController::editApplication'
    _title: 'Edit Application'
  requirements:
    _permission: 'edit applications'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

esn_membership_manager.crop:
  path: '/api/memberships/edit/crop'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\EditController::cropPhoto'
    _title: 'Crop Photo'
  requirements:
    _permission: 'edit applications'
  methods: [ POST ]
  options:
    _auth: [ 'oauth2', 'cookie' ]

esn_membership_manager.online:
  path: '/api/memberships/online'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\OnlineController::checkOnlineStatus'
  requirements:
    _access: 'TRUE'
  methods: [ GET ]

esn_membership_manager.authentication_code:
  path: '/api/memberships/auth/{type}/code'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AuthenticationController::request'
    _title: 'Request Authentication Code'
  requirements:
    _access: 'TRUE'
  methods: [ POST ]
  options:
    parameters:
      type:
        type: string

esn_membership_manager.authentication_verify:
  path: '/api/memberships/auth/{type}/verify'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AuthenticationController::verify'
    _title: 'Verify Authentication Code'
  requirements:
    _access: 'TRUE'
  methods: [ POST ]
  options:
    parameters:
      type:
        type: string

esn_membership_manager.apple_wallet_device:
  path: '/api/apple-wallet/v1/devices/{deviceLibraryIdentifier}/registrations/{passTypeIdentifier}/{serialNumber}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AppleWalletController::handleDeviceRegistration'
  methods: [ POST, DELETE ]
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      deviceLibraryIdentifier:
        type: string
      passTypeIdentifier:
        type: string
      serialNumber:
        type: string

esn_membership_manager.apple_wallet_updatable_passes:
  path: '/api/apple-wallet/v1/devices/{deviceLibraryIdentifier}/registrations/{passTypeIdentifier}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AppleWalletController::getUpdatablePasses'
  methods: [ GET ]
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      passTypeIdentifier:
        type: string

esn_membership_manager.apple_wallet_latest_pass:
  path: '/api/apple-wallet/v1/passes/{passTypeIdentifier}/{serialNumber}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AppleWalletController::getLatestPass'
  methods: [ GET ]
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      passTypeIdentifier:
        type: string
      serialNumber:
        type: string

esn_membership_manager.apple_wallet_log:
  path: '/api/apple-wallet/v1/log'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AppleWalletController::logMessage'
  methods: [ POST ]
  requirements:
    _access: 'TRUE'

esn_membership_manager.stripe_webhook:
  path: '/stripe/webhook'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\StripeWebhookController::handleWebhook'
  requirements:
    _access: 'TRUE'
  methods: [ POST ]

esn_membership_manager.apply:
  path: '/memberships/apply'
  defaults:
    _form: '\Drupal\esn_membership_manager\Form\ApplicationForm'
    _title: 'Membership Registration'
  requirements:
    _access: 'TRUE'

esn_membership_manager.apply_verify_id:
  path: '/memberships/apply/verify/id'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\DiditController::callback'
    _title: 'Didit ID Verification'
  requirements:
    _access: 'TRUE'

esn_membership_manager.apply_verify_esn:
  path: '/memberships/apply/verify/esn-accounts'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ESNAccountsController::callback'
    _title: 'ESN Accounts Verification'
  requirements:
    _access: 'TRUE'

esn_membership_manager.apply_success:
  path: '/memberships/apply/success'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ApplicationController::successPage'
    _title: 'Application Received'
  requirements:
    _access: 'TRUE'

esn_membership_manager.terms_of_service:
  path: '/memberships/terms-of-service'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Page\LegalPages::tosPage'
    _title: 'Terms of Service'
  requirements:
    _access: 'TRUE'

esn_membership_manager.privacy_policy:
  path: '/memberships/privacy-policy'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Page\LegalPages::privacyPage'
    _title: 'Privacy Policy'
  requirements:
    _access: 'TRUE'

esn_membership_manager.view_applications:
  path: '/memberships/applications'
  defaults:
    _form: '\Drupal\esn_membership_manager\Form\ViewApplicationsForm'
    _title: 'View Applications'
  requirements:
    _permission: 'view applications'

esn_membership_manager.scan_page:
  path: '/memberships/scan'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Page\ScanPage::scanPage'
    _title: 'Scan Free Passes and ESNcards'
  requirements:
    _permission: 'scan cards'

esn_membership_manager.manage_esncard_numbers:
  path: '/memberships/manage-esncard-numbers'
  defaults:
    _form: '\Drupal\esn_membership_manager\Form\ESNcardNumberForm'
    _title: 'Bulk Insert ESNcards'
  requirements:
    _permission: 'manage esncard numbers'
  options:
    _admin_route: FALSE

esn_membership_manager.settings:
  path: '/admin/config/system/esn-membership-manager'
  defaults:
    _form: '\Drupal\esn_membership_manager\Form\SettingsForm'
    _title: 'ESN Membership Manager Settings'
  requirements:
    _permission: 'manage module settings'

esn_membership_manager.weeztix_oauth_callback:
  path: '/admin/config/system/esn-membership-manager/weeztix-auth-callback'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\WeeztixAuthController::callback'
    _title: 'Weeztix Authentication'
  requirements:
    _permission: 'manage module settings'

esn_membership_manager.file_download:
  path: '/memberships/files/{applicationID}/{filename}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\FileAccessController::download'
    _title: 'Download File'
  requirements:
    _access: 'TRUE'
    applicationID: \d+|temp_uploads
    filename: .+
  options:
    parameters:
      applicationID:
        type: string
      filename:
        type: string

esn_membership_manager.file_preview:
  path: '/memberships/files/{file}/preview'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ApplicationController::preview'
    _title: 'File Preview'
  requirements:
    _permission: 'view applications'
  options:
    parameters:
      file:
        type: entity:file

esn_membership_manager.application_view:
  path: '/memberships/application/{id}/view'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ApplicationController::viewApplication'
    _title: 'View Application'
  requirements:
    _permission: 'view applications'
  methods: [ GET, POST ]

esn_membership_manager.esncard_view:
  path: '/memberships/applications/{id}/esncard'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ApplicationController::viewESNcard'
    _title: 'View ESNcard'
  requirements:
    _permission: 'view applications'
  methods: [ GET ]

esn_membership_manager.face_pdf:
  path: '/memberships/applications/face-pdf'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\ApplicationController::generateFacePDF'
    _title: 'Generate ESNcard Pictures PDF'
  requirements:
    _permission: 'view applications'

esn_membership_manager.add_to_google_wallet:
  path: '/memberships/google-wallet/{identifier}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\GoogleWalletController::addToWallet'
    _title: 'Add to Google Wallet'
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      identifier:
        type: string

esn_membership_manager.download_apple_pass:
  path: '/memberships/apple-wallet/{identifier}'
  defaults:
    _controller: '\Drupal\esn_membership_manager\Controller\AppleWalletController::download'
    _title: 'Download Apple Wallet Pass'
  requirements:
    _access: 'TRUE'
  options:
    parameters:
      identifier:
        type: string