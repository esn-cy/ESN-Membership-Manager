name: GitLab Mirror

on:
  push:
    branches: [ "**" ]
    tags:
      - "*"

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@git.esn.org/countries/esn-cyprus/esn-membership-manager.git
          git push gitlab --all --force
          git push gitlab --tags --force