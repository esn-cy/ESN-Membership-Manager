services:
  logger.channel.esn_membership_manager:
    parent: logger.channel_base
    arguments: [ 'esn_membership_manager' ]

  esn_membership_manager.esncard_service:
    class: Drupal\esn_membership_manager\Service\ESNcardService
    arguments:
      - '@config.factory'
      - '@database'
      - '@entity_type.manager'
      - '@logger.factory'
      - '@esn_membership_manager.stripe_service'
      - '@esn_membership_manager.email_manager'
      - '@esn_membership_manager.weeztix_service'
      - '@esn_membership_manager.google_service'

  esn_membership_manager.file_service:
    class: Drupal\esn_membership_manager\Service\FileService
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@file.repository'
      - '@file.usage'
      - '@stream_wrapper_manager'
      - '@logger.factory'

  esn_membership_manager.cron_service:
    class: Drupal\esn_membership_manager\Service\CronService
    arguments:
      - '@entity_type.manager'
      - '@esn_membership_manager.file_service'
      - '@logger.factory'

  esn_membership_manager.stripe_service:
    class: Drupal\esn_membership_manager\Service\StripeService
    arguments:
      - '@config.factory'
      - '@logger.factory'

  esn_membership_manager.weeztix_service:
    class: Drupal\esn_membership_manager\Service\WeeztixService
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@state'
      - '@logger.factory'
      - '@datetime.time'

  esn_membership_manager.google_service:
    class: Drupal\esn_membership_manager\Service\GoogleService
    arguments:
      - '@config.factory'
      - '@esn_membership_manager.file_service'
      - '@logger.factory'

  esn_membership_manager.apple_wallet_service:
    class: Drupal\esn_membership_manager\Service\AppleWalletService
    arguments:
      - '@config.factory'
      - '@settings'
      - '@module_handler'
      - '@esn_membership_manager.file_service'
      - '@http_client'
      - '@logger.factory'

  esn_membership_manager.email_manager:
    class: Drupal\esn_membership_manager\Service\EmailManager
    arguments:
      - '@config.factory'
      - '@logger.factory'
      - '@plugin.manager.mail'
      - '@renderer'

  esn_membership_manager.didit_service:
    class: Drupal\esn_membership_manager\Service\DiditService
    arguments:
      - '@config.factory'
      - '@database'
      - '@http_client'
      - '@logger.factory'

  stream_wrapper.membership:
    class: Drupal\esn_membership_manager\StreamWrapper\MembershipStreamWrapper
    tags:
      - { name: stream_wrapper, scheme: membership }